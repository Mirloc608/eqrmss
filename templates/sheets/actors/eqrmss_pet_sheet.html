<header class="sheet-header" style="display:flex;gap:15px;align-items:center;padding:10px;background:#181818;border-bottom:1px solid #333;">
  <div style="width:80px;height:80px;border:1px solid #444;border-radius:4px;overflow:hidden;">
    <img src="{{actor.img}}" data-edit="img" alt="{{actor.name}}" style="width:100%;height:100%;object-fit:cover;">
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
    <h1 style="margin:0;font-size:1.2rem;color:#fff;">
      <input name="name" type="text" value="{{actor.name}}" style="background:transparent;border:none;border-bottom:1px solid #444;color:#fff;width:100%;padding:2px 0;">
    </h1>
    <div style="font-size:0.85rem;color:#ccc;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;">
      <div><strong>Owner:</strong> <span>{{owner.name}}</span></div>
      <div><strong>Role:</strong> <span>{{system.role}}</span></div>
      <div><strong>Level:</strong> <span>{{system.level}}</span></div>
      <div><strong>XP:</strong> <span>{{system.xp}} / {{system.nextLevelXp}}</span></div>
    </div>
  </div>
</header>

<section class="sheet-body" style="padding:10px;">
  <div class="panel">
    <h3>Pet Statistics</h3>
    <table class="rmss-table">
      <thead>
        <tr><th>Stat</th><th>Value</th></tr>
      </thead>
      <tbody>
        <tr><td>HP</td><td>{{system.hp}}</td></tr>
        <tr><td>AC</td><td>{{system.ac}}</td></tr>
        <tr><td>Attack Bonus</td><td>{{system.attackBonus}}</td></tr>
        <tr><td>Damage</td><td>{{system.damage}}</td></tr>
        <tr><td>Move Rate</td><td>{{system.moveRate}}</td></tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h3>Commands</h3>
    <button class="pet-command-attack"><i class="fas fa-crosshairs"></i> Attack</button>
    <button class="pet-command-guard"><i class="fas fa-shield-alt"></i> Guard</button>
    <button class="pet-command-follow"><i class="fas fa-walking"></i> Follow</button>
  </div>
</section>
