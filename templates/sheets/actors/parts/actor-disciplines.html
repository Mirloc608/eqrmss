<div class="tab disciplines" data-group="primary" data-tab="disciplines">
  {{#if disciplines}}
  <div class="panel">
    <h4>Disciplines</h4>
    <p><em>Trained combat disciplines.</em></p>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px; align-items: stretch;">
    {{#each disciplines}}
    <div class="discipline-entry">
      <button type="button" data-action="activateDiscipline" data-discipline-id="{{this.id}}" title="{{this.name}} (Level {{this.level}}){{#if this.description}} - {{this.description}}{{/if}}" style="width: 100%;">
        {{#if this.icon}}<img src="{{this.icon}}" alt="" class="discipline-icon" />{{/if}}{{this.name}} ({{this.level}})
      </button>
    </div>
    {{/each}}
    </div>
  </div>
  {{/if}}

  {{#if capstones}}
  <div class="panel">
    <h4>Era Capstones</h4>
    <p><em>Hand-designed abilities earned at level cap increases.</em></p>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px; align-items: stretch;">
      {{#each capstones}}
      <div class="capstone-entry">
        <button type="button" data-action="activateCapstone" data-capstone-id="{{this.id}}" {{#if this.onCooldown}}disabled{{/if}} title="{{this.name}} (Level {{this.level}}): {{this.effect}} Cooldown: {{this.cooldown}}{{#if this.description}} - {{this.description}}{{/if}}" style="width: 100%;">
          {{#if this.icon}}<img src="{{this.icon}}" alt="" class="capstone-icon" />{{/if}}{{this.name}} ({{this.level}}){{#if this.onCooldown}} (Used){{/if}}
        </button>
      </div>
      {{/each}}
    </div>
  </div>
  {{/if}}
</div>
