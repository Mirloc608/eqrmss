<div class="languages-grid-container">

<div class="languages-grid-heading language-name">
    Language
</div>

<div class="languages-grid-heading">
    Spoken
</div>

<div class="languages-grid-heading">
    Written
</div>

<div class="languages-grid-heading">
</div>

{{#each languages as |language|}}

<div class="languages-grid-cell language-name item"
     data-item-id="{{language.id}}">

    {{language.name}}

</div>

<div class="languages-grid-cell">

    {{#if language.system.spoken}}
        Yes
    {{else}}
        No
    {{/if}}

</div>

<div class="languages-grid-cell">

    {{#if language.system.written}}
        Yes
    {{else}}
        No
    {{/if}}

</div>

<div class="languages-grid-cell item-controls">

<a class="item-edit"
   data-item-id="{{language.id}}"
   title="Edit Language">

<i class="fas fa-edit"></i>

</a>

<a class="item-delete"
   data-item-id="{{language.id}}"
   title="Delete Language">

<i class="fas fa-trash"></i>

</a>

</div>

{{/each}}

</div>
