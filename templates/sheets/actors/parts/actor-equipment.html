<div class="tab" data-group="primary" data-tab="equipment">
  <div class="equipment-split" style="display: flex; gap: 10px;">
    <div class="panel" style="flex: 2;">
      <h3>Equipment and Gear</h3>
      <table class="rmss-table">
        <thead><tr><th>Item (Description)</th><th>Location</th><th>Weight</th></tr></thead>
        <tbody>
          {{#each actor.items}}
            {{#if (eq this.type "equipment")}}
            <tr><td>{{this.name}}</td><td>{{this.system.location}}</td><td>{{this.system.weight}}</td></tr>
            {{/if}}
          {{/each}}
        </tbody>
      </table>
    </div>
    <div class="panel" style="flex: 1;">
      <h3>Coins and Wealth</h3>
      <div class="field-row"><label>Platinum:</label> <span>{{derived.wealth.pp}}</span></div>
      <div class="field-row"><label>Gold:</label> <span>{{derived.wealth.gp}}</span></div>
      <div class="field-row"><label>Silver:</label> <span>{{derived.wealth.sp}}</span></div>
      <div class="field-row"><label>Copper:</label> <span>{{derived.wealth.cp}}</span></div>
    </div>
  </div>
</div>
