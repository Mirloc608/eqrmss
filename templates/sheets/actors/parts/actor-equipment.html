<div class="tab" data-group="primary" data-tab="equipment">
  <div class="equipment-split" style="display: flex; gap: 10px;">
    <div class="panel" style="flex: 2;">
      <h3>Equipment and Gear</h3>
      <table class="rmss-table">
        <thead><tr><th>Item (Description)</th><th>Location</th><th>Weight</th></tr></thead>
        <tbody>
          {{#each actor.items}}
            {{#if (eq this.type "equipment")}}
            <tr data-item-id="{{this._id}}">
              <td>{{this.name}}</td>
              <td>
                <select class="item-location" data-item-id="{{this._id}}">
                  <option value="equipped" {{#if (eq this.system.location "equipped")}}selected{{/if}}>Equipped</option>
                  <option value="pack" {{#if (eq this.system.location "pack")}}selected{{/if}}>Pack</option>
                  <option value="ground" {{#if (eq this.system.location "ground")}}selected{{/if}}>Ground</option>
                </select>
              </td>
              <td>{{this.system.weight}}</td>
            </tr>
            {{/if}}
          {{/each}}
        </tbody>
      </table>
    </div>
    <div class="panel" style="flex: 1;">
      <h3>Coins and Wealth</h3>
      <div class="field-row" style="display: flex; justify-content: space-between;"><label>Platinum:</label> <span>{{or derived.wealth.pp 0}}</span></div>
      <div class="field-row" style="display: flex; justify-content: space-between;"><label>Gold:</label> <span>{{or derived.wealth.gp 0}}</span></div>
      <div class="field-row" style="display: flex; justify-content: space-between;"><label>Silver:</label> <span>{{or derived.wealth.sp 0}}</span></div>
      <div class="field-row" style="display: flex; justify-content: space-between;"><label>Copper:</label> <span>{{or derived.wealth.cp 0}}</span></div>
    </div>
  </div>
</div>
