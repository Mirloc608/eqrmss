<div class="tab" data-group="primary" data-tab="songs">
  <h3>Songs</h3>
  <div class="panel">
    <div class="song-grid">
      {{#each items.songs}}
      <div class="song-card" draggable="true" data-item-id="{{this.id}}">
        <div class="song-name">{{this.name}}</div>
        <div class="song-actions">
          <button data-action="bardStart" data-song-id="{{this.id}}">Play</button>
          <button data-action="bardStop" data-song-id="{{this.id}}">Stop</button>
        </div>
      </div>
      {{else}}
      <p style="opacity: 0.6;">No songs known.</p>
      {{/each}}
    </div>
  </div>
</div>
