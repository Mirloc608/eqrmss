<div class="tab" data-group="primary" data-tab="songs">
  <h3>Songs</h3>
  <div class="panel">
    <h4>Songs</h4>
    <table class="rmss-table">
      <thead><tr><th></th><th>Name</th><th>Level</th><th>Type</th><th>Range</th><th>Duration</th></tr></thead>
      <tbody>
        {{#each items.songs}}
          <tr data-item-id="{{this._id}}">
            <td><button data-action="bardStart" data-song-id="{{this._id}}" title="Start playing this song">Play</button> <button data-action="bardStop" data-song-id="{{this._id}}" title="Stop playing this song">Stop</button></td>
            <td><a class="item-open" data-item-id="{{this._id}}">{{this.name}}</a></td>
            <td>{{this.system.level}}</td>
            <td>{{this.system.type}}</td>
            <td>{{this.system.range}}</td>
            <td>{{this.system.duration}}</td>
          </tr>
        {{else}}
          <tr><td colspan="6" style="opacity: 0.6;">No songs known.</td></tr>
        {{/each}}
      </tbody>
    </table>
  </div>
</div>
