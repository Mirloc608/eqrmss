<section class="money-container">

    <div class="money-column">

        <div class="money-field">
            <label>Mithril</label>
            <input type="text"
                   name="system.money.mithril"
                   value="{{system.money.mithril}}"
                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Platinum</label>
            <input type="text"
                   name="system.money.platinum"
                   value="{{system.money.platinum}}"
                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Gold</label>
            <input type="text"
                   name="system.money.gold"
                   value="{{system.money.gold}}"
                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Silver</label>
            <input type="text"
                   name="system.money.silver"
                   value="{{system.money.silver}}"
                   data-dtype="Number"/>
        </div>

    </div>

    <div class="money-column">

        <div class="money-field">
            <label>Bronze</label>
            <input type="text"
                   name="system.money.bronze"
                   value="{{system.money.bronze}}"
                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Copper</label>
            <input type="text"
                   name="system.money.copper"

                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Tin</label>
            <input type="text"
                   name="system.money.tin"
                   value="{{system.money.tin}}"
                   data-dtype="Number"/>
        </div>

        <div class="money-field">
            <label>Iron</label>
            <input type="text"
                   name="system.money.iron"
                   value="{{system.money.iron}}"
                   data-dtype="Number"/>
        </div>

    </div>

</section>
