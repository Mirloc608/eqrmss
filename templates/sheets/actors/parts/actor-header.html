<header class="sheet-header" style="display: flex; gap: 15px; align-items: center; padding: 10px; background: #181818; border-bottom: 1px solid #333;">
  
  <!-- Left Side: Character Image -->
  <div class="actor-image-container" style="width: 90px; height: 90px; flex-shrink: 0; border: 1px solid #444; border-radius: 4px; overflow: hidden;">
    <img src="{{actor.img}}" data-edit="img" alt="{{actor.name}}" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- Right Side: Name and Info Block Side-by-Side with Image -->
  <div class="header-details" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px;">
    <h1 class="sheet-title" style="margin: 0; font-size: 1.4rem; color: #fff;">
      <input name="name" type="text" value="{{actor.name}}" placeholder="Character Name" style="background: transparent; border: none; border-bottom: 1px solid #444; color: #fff; width: 100%; padding: 2px 0;"/>
    </h1>
    <div class="sheet-subinfo" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 25px; font-size: 0.85rem; color: #ccc;">
      <div style="display: flex; justify-content: space-between;"><strong>Race:</strong> <span>{{system.origin.raceName}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Profession:</strong> <span>{{system.origin.className}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Realm:</strong> <span>{{system.fixed_info.realm}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Training Packages:</strong> <span>{{system.fixed_info.trainingPackages}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Nationality:</strong> <span>{{system.background.nationality}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Home Town:</strong> <span>{{system.origin.cityName}}</span></div>
      <div style="display: flex; justify-content: space-between;"><strong>Religion:</strong> <span>{{system.background.deity}}</span></div>
    </div>
  </div>

  <!-- Rightmost: Header Controls -->
  <div class="header-controls" style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
    <a class="pet-manager-open" title="Manage Pets" style="color: #ccc;">
      <i class="fas fa-paw"></i>
    </a>
  </div>

</header>
