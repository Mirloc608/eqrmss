<form class="{{cssClass}}" autocomplete="off">
    <header class="sheet-header">
        <img src="{{item.img}}" data-edit="img" title="{{item.name}}" height="64" width="64"/>
        <h1><input name="name" type="text" value="{{item.name}}" placeholder="{{ localize 'Name' }}"/></h1>
    </header>
    <div class="sheet-content">
        <div>
            {{#if isGM}}
            <fieldset class="eqrmss-weapon-composer">
                <legend>Weapon Composer</legend>
                <div class="form-group">
                    <label>Template</label>
                    <select name="system.weaponTemplate" class="weapon-composer-select">
                        <option value=""></option>
                        {{selectOptions weaponOptions.templates selected=system.weaponTemplate valueAttr="id" labelAttr="name"}}
                    </select>
                </div>
                <div class="form-group">
                    <label>Material</label>
                    <select name="system.material" class="weapon-composer-select">
                        <option value=""></option>
                        {{selectOptions weaponOptions.materials selected=system.material valueAttr="id" labelAttr="name"}}
                    </select>
                </div>
                <div class="form-group">
                    <label>Condition</label>
                    <select name="system.condition" class="weapon-composer-select">
                        <option value=""></option>
                        {{selectOptions weaponOptions.conditions selected=system.condition valueAttr="id" labelAttr="name"}}
                    </select>
                </div>
                <p class="hint">Changing any of these recomposes the weapon below (name and stats).</p>
            </fieldset>
            {{/if}}
            <fieldset class="eqrmss-weapon-stats">
                <legend>Weapon Data</legend>
                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.type"}}</label>
                    <select name="system.type" style="flex: 1;">
                        {{selectOptions weaponTypeOptions selected=system.type valueAttr="value" labelAttr="label"}}
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px;">
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.cost"}}</label>
                        <input name="system.cost" type="text" value="{{system.cost}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.prod_time"}}</label>
                        <input name="system.prod_time" type="text" value="{{system.prod_time}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.weight"}}</label>
                        <input name="system.weight" type="text" value="{{system.weight}}" data-dtype="Number" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;" title="Breakage numbers">B#s (Breakage)</label>
                        <input name="system.breakage_range" type="text" value="{{system.breakage_range}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.strength"}}</label>
                        <input name="system.strength" type="text" value="{{system.strength}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.fumble_range"}}</label>
                        <input name="system.fumble_range" type="text" value="{{system.fumble_range}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Attack Table</label>
                        <input name="system.attackTable" type="text" value="{{system.attackTable}}" data-dtype="Number" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Length</label>
                        <input name="system.length" type="text" value="{{system.length}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Critical Type</label>
                        <input name="system.criticalType" type="text" value="{{system.criticalType}}" data-dtype="String" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">OB Mod</label>
                        <input name="system.obMod" type="text" value="{{system.obMod}}" data-dtype="Number" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Damage Mod</label>
                        <input name="system.damageMod" type="text" value="{{system.damageMod}}" data-dtype="Number" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Unusual Style (§4.13)</label>
                        <select name="system.styleDegree" style="flex: 1;">
                            <option value=""{{#unless system.styleDegree}} selected{{/unless}}>Normal use</option>
                            <option value="similar"{{#if (eq system.styleDegree "similar")}} selected{{/if}}>Relatively similar (-10 OB)</option>
                            <option value="differs"{{#if (eq system.styleDegree "differs")}} selected{{/if}}>Differs, similar nature (-30 OB)</option>
                            <option value="opposite"{{#if (eq system.styleDegree "opposite")}} selected{{/if}}>Directly opposite (-50 OB)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Style Crit Type</label>
                        <select name="system.styleCritType" style="flex: 1;">
                            <option value=""{{#unless system.styleCritType}} selected{{/unless}}>Weapon's own</option>
                            <option value="S"{{#if (eq system.styleCritType "S")}} selected{{/if}}>Slash</option>
                            <option value="P"{{#if (eq system.styleCritType "P")}} selected{{/if}}>Puncture</option>
                            <option value="K"{{#if (eq system.styleCritType "K")}} selected{{/if}}>Krush</option>
                            <option value="G"{{#if (eq system.styleCritType "G")}} selected{{/if}}>Grapple</option>
                            <option value="U"{{#if (eq system.styleCritType "U")}} selected{{/if}}>Unbalance</option>
                            <option value="T"{{#if (eq system.styleCritType "T")}} selected{{/if}}>Tiny</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">Style Severity Shift</label>
                        <input name="system.styleSeverityShift" type="text" value="{{system.styleSeverityShift}}" data-dtype="Number" placeholder="0" style="flex: 1;"/>
                    </div>
                    <div class="form-group">
                        <label style="min-width: 110px; flex: 0 0 auto;">{{localize "eqrmss.weapon.equipped"}}</label>
                        <input type="checkbox" name="system.equipped" {{checked system.equipped}}/>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 6px;">
                    <label style="min-width: 110px; flex: 0 0 auto;">Notes</label>
                    <input name="system.notes" type="text" value="{{system.notes}}" data-dtype="String" style="flex: 1;" placeholder="Informational note"/>
                </div>
            </fieldset>
                {{localize "eqrmss.item.description"}}
                {{editor enrichedDescription target="system.description" button=true owner=owner editable=editable}}
        </div>
    </div>
</form>
