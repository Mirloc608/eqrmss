<form class="{{cssClass}}" autocomplete="off">
    <header class="sheet-header">
        <img src="{{item.img}}" data-edit="img" title="{{item.name}}" height="64" width="64"/>
        <h1><input name="name" type="text" value="{{item.name}}" placeholder="{{ localize 'Name' }}"/></h1>
    </header>
    <div class="sheet-content">
        <div>
            <table>
                <tr>
                    <th>{{localize "eqrmss.item.quantity"}}</th>
                    <th>{{localize "eqrmss.item.weight"}}</th>
                    <th>{{localize "eqrmss.item.cost"}} (tp)</th>
                </tr>
                <td>
                    <input name="system.quantity" type="text" value="{{system.quantity}}" data-dtype="Number"/>
                </td>
                <td>
                    <input name="system.weight" type="text" value="{{system.weight}}" data-dtype="Number"/>
                </td>
                <td>
                    <input name="system.cost" type="number" min="0" step="1" value="{{system.cost}}" data-dtype="Number"/>
                </td>
            </table>
            <div class="form-group" style="margin: 8px 0;">
                <label style="min-width: 110px; flex: 0 0 auto;">Notes</label>
                <input name="system.notes" type="text" value="{{system.notes}}" data-dtype="String" style="flex: 1;" placeholder="e.g. consumed, reusable, quest item"/>
            </div>
                {{localize "eqrmss.item.description"}}
                {{editor enrichedDescription target="system.description" button=true owner=owner editable=editable}}
        </div>
    </div>
</form>
