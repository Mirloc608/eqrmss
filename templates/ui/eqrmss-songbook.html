<section class="eq-songbook">
  <header class="eq-songbook-header">
    <h2>Bard Songbook</h2>
    <select data-action="filter-category">
      <option value="">All Categories</option>
      {{#each categories}}
        <option value="{{id}}" {{#ifEquals ../categoryFilter id}}selected{{/ifEquals}}>
          {{label}}
        </option>
      {{/each}}
    </select>
  </header>

  <div class="eq-songbook-list">
    {{#each songs}}
      <div class="eq-songbook-entry">
        <img src="{{img}}" class="eq-song-icon" />
        <div class="eq-song-info">
          <div class="eq-song-name">{{name}}</div>
          <div class="eq-song-meta">
            Tier {{system.tier}} · {{system.category}} · Lv {{system.level}}
          </div>
          <div class="eq-song-desc">{{system.description}}</div>
        </div>
      </div>
    {{/each}}
  </div>
</section>
